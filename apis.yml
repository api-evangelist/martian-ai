name: Martian
kind: company
description: Martian operates an LLM model router and gateway that dynamically routes each request to
  the best underlying model across providers for the optimal balance of quality, latency, and cost. The
  Martian Gateway exposes a drop-in, OpenAI-compatible REST API (and an Anthropic Messages-compatible
  surface) so applications can route across a large catalog of models by changing only the base URL.
