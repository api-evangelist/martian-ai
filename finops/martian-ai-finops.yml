meters:
- name: routed_requests
  description: Requests routed through the Martian Gateway, metered beyond the free allotment.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - selected_model
- name: input_tokens
  description: Tokens sent in routed chat / messages requests; cost depends on the selected upstream model.
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - selected_model
- name: output_tokens
  description: Tokens generated by the selected upstream model on a routed request.
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - selected_model
principles:
- name: Visibility
  description: Inspect Martian usage and per-request routing decisions to see which upstream models are serving spend.
- name: Allocation
  description: Tag API keys per workload/team and map routed spend to internal cost centers.
- name: Optimization
  description: Tune the willingness-to-pay / cost-quality trade-off so the router selects cheaper models when sufficient; rely on automatic failover to avoid costly retries.
- name: Accountability
  description: Assign owners per project/key and review routed spend monthly against budget.
