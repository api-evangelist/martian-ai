description: >-
  FinOps view of Martian Gateway spend. Martian is an LLM model router whose
  core value proposition is cost optimization: for each request it routes to
  the model that meets quality targets at the lowest cost, with controls such
  as willingness-to-pay to trade quality against price. The marginal cost of a
  routed request is primarily the pass-through cost of the selected upstream
  provider model; Martian's own gateway unit rates are not publicly enumerated
  and are not reconciled in this artifact.
notes: >-
  Verify Martian gateway markups, free-allotment terms, and any per-request
  fee against Martian during reconciliation. Because routing decisions change
  which upstream model serves a request, per-request cost varies with the
  selected model and the configured cost/quality trade-off.
